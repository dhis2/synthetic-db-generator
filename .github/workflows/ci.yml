# The checks of the pre-commit hooks (ruff, ty) and the tests, and a build of the example, on main
# and on pull requests. A release is a tag vX.Y.Z pushed on main: nothing is published, it is
# installed from git by tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # One job: the checks take seconds beside the build, so a job of their own would gain little.
    # The build runs only if they pass. A standard runner of a public repository: 4 CPUs and 16
    # GB, which the build's caps fit (README, Caps).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions pinned by commit, which Dependabot updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, which the version is built from
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact, so CI changes only by a commit; within pyproject.toml's required-version.
          version: "0.13.7"
      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked pytest
      - name: Build the example's district
        run: uv run --locked dbgen build examples/pregnancy/pregnancy.toml --orgunit EX0201
        env:
          DBGEN_DB_MEMORY: 3g
          DBGEN_WEB_MEMORY: 4g
          DBGEN_WEB_HEAP: 2500m
          DBGEN_HEADROOM: 3g
      - name: Upload the build's manifest, timings and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            output/pregnancy-EX0201/manifest.json
            output/stage/pregnancy-EX0201/timings/
            output/stage/pregnancy-EX0201/provenance.json
          if-no-files-found: ignore
